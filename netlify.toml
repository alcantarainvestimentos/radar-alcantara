# Publica só quando o visual do site muda.
# Commits que mexem apenas em data.json ou README.md são ignorados (não gastam créditos do Netlify):
# o site lê data.json direto do GitHub.
[build]
  publish = "."
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)data.json' ':(exclude)README.md' ':(exclude)site-institucional'"

[functions]
  node_bundler = "esbuild"
